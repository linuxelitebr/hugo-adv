# Fictitious example site for the hugo-adv theme. All data below is made up.
baseURL = "https://example.com/"
locale = "pt-BR"
title = "Exemplo Advocacia"
theme = "hugo-adv"
themesDir = "../.."
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true
# Sitemap lastmod from git history (requires a full clone in CI builds).
enableGitInfo = true

# lastmod source order: git commit, explicit front matter, publish date, file time.
# Guarantees every sitemap entry has a lastmod.
[frontmatter]
  lastmod = [":git", "lastmod", "date", ":fileModTime"]

[pagination]
  pagerSize = 12
  # No /page/1/ redirect pages (the section URL is the first page).
  disableAliases = true

[[menus.main]]
  name = "Início"
  pageRef = "/"
  weight = 5
[[menus.main]]
  name = "O escritório"
  pageRef = "/o-escritorio"
  weight = 10
[[menus.main]]
  name = "Áreas de atuação"
  pageRef = "/areas-de-atuacao"
  weight = 20
[[menus.main]]
  name = "Equipe"
  pageRef = "/equipe"
  weight = 30
[[menus.main]]
  name = "Artigos"
  pageRef = "/artigos"
  weight = 40

[params]
  description = "Escritório de advocacia fictício usado para demonstrar o tema hugo-adv."

  [params.firm]
    name = "Exemplo Advocacia"
    legalName = "Exemplo Sociedade de Advogados"
    tagline = "Advocacia empresarial e cível"
    oabRegistration = "OAB/SP 00.000"
    cnpj = "00.000.000/0001-00"
    email = "contato@example.com"
    phone = "(11) 0000-0000"
    whatsapp = "5511900000000"
    whatsappDisplay = "(11) 90000-0000"
    hours = "Segunda a sexta, das 9h às 18h"
    foundingDate = "2020-01-15"
    founder = "maria-exemplo"            # slug of the founder's page in the people section
    areaServed = ["São Paulo"]
    [[params.firm.openingHours]]
      days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]
      opens = "09:00"
      closes = "18:00"
    [params.firm.address]
      street = "Rua Exemplo, 100, sala 1"
      district = "Centro"
      city = "São Paulo"
      state = "SP"
      postalCode = "00000-000"
      mapUrl = "https://www.openstreetmap.org/"
      note = "Atendimento presencial com hora marcada"
    [[params.firm.social]]
      name = "LinkedIn"
      url = "https://www.linkedin.com/"

  [params.brand]
    logo = "brand/logo.svg"
    logoDark = "brand/logo-dark.svg"
    favicon = "brand/favicon.svg"
    ogImage = "brand/og-image.png"
    appleTouchIcon = "brand/icon-180.png"
    [[params.brand.icons]]
      path = "brand/icon-48.png"
    [[params.brand.icons]]
      path = "brand/icon-192.png"
    [[params.brand.icons]]
      path = "brand/icon-512.png"
