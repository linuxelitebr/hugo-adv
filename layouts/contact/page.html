{{- define "main" }}
{{- partial "page-header.html" (dict "page" .) }}
<div class="section">
  <div class="container layout-aside">
    <div class="prose">
      {{ .Content }}
      {{- partial "contact-details.html" . }}
    </div>
    <aside class="contact-aside" aria-label="{{ T "contactDetails" }}">
      {{- partial "contact-actions.html" (dict "variant" "default") }}
    </aside>
  </div>
</div>
{{- end }}
