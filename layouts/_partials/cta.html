{{- /* Sober call to action with contact channels in priority order. .Params.cta overrides the text. */ -}}
<aside class="cta" aria-labelledby="cta-title">
  <h2 id="cta-title">{{ T "ctaTitle" }}</h2>
  <p>{{ .Params.cta | default (T "ctaDefault") }}</p>
  {{- partial "contact-actions.html" (dict "variant" "default") }}
</aside>
